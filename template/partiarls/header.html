{% if user.is_authenticated %}
<header class="w-full flex justify-end items-center gap-2 p-4 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700">
  <span class="text-sm text-gray-500 dark:text-gray-400">{{ user.email }}</span>
  <a href="{% url 'logout' %}" class="flex items-center gap-1 text-sm font-semibold text-red-500 hover:text-red-600 transition-colors">
    Cerrar sesión
  </a>
</header>
{% endif %}
