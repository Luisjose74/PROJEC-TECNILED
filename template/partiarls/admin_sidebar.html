  <!-- Logo + botón cerrar (la X solo se ve en celulares) -->

    <a href="{% url 'inicio' %}" class="text-2xl font-black text-gray-900 dark:text-white flex items-center gap-2">
      <svg class="w-7 h-7 text-[#F2AE30]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>

    <button type="button" onclick="cerrarSidebar()" class="lg:hidden text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">

      cuando pasas el mouse por cualquier parte del enlace.
    - Las que tienen href="#" todavía no tienen vista; cuando tu compañero la cree,
      cambia el # por la etiqueta url de Django con el nombre de su ruta.
  -->
  <nav class="flex-1 overflow-y-auto p-4 space-y-1">
