{% extends 'admin_base.html' %}
{% block title %}Proveedor (CBV) - TECNILED{% endblock %}
{% block titulo_seccion %}Proveedores (CBV){% endblock %}
{% block content %}
<div class="bg-white dark:bg-gray-800 rounded-3xl w-full max-w-lg mx-auto shadow-2xl border border-gray-100 dark:border-gray-700 p-8">
  <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">
    {% if object %}Editar proveedor{% else %}Nuevo proveedor{% endif %}
  </h3>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex justify-end gap-3 pt-4">
      <a href="{% url 'cbv_proveedores_lista' %}" class="px-5 py-2.5 text-gray-600 dark:text-gray-300 font-semibold hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl">Cancelar</a>
      <button type="submit" class="px-5 py-2.5 bg-[#F2AE30] hover:bg-[#d99b28] text-black font-bold rounded-xl shadow-lg">Guardar</button>
    </div>
  </form>
</div>
{% endblock %}
